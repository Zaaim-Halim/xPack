name: Release

# Publishes the binaries. Everything else that distributes xPack — an install
# script, a Homebrew formula, a Maven artifact, a container image — is a thin
# wrapper over the archives this workflow attaches to a GitHub Release, so this
# is the one place that has to be right.
#
# Every target is built on a runner of its own architecture. Nothing here
# cross-compiles: the C in `ring` needs a cross toolchain that is a standing
# source of breakage, and a Windows binary cannot be linked anywhere but
# Windows anyway. Renting five machines is cheaper than maintaining that.

on:
  push:
    tags: ["v*"]
  # A dry run builds and verifies everything and publishes nothing, so the
  # release path can be exercised without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          # Linux links against musl so the binaries do not inherit the build
          # host's glibc version. A launcher that ships to end users has to run
          # on whatever distribution they happen to have, including Alpine and
          # anything older than this runner.
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          # `ubuntu-24.04-arm` is free for public repositories only. Should
          # this repository ever become private, this job will not find a
          # runner.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          # The last Intel image GitHub offers; it is retired in August 2027,
          # after which an Intel build needs a machine of its own.
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      # `ring` compiles C for the target, so a musl build needs a musl C
      # compiler. If this job ever fails, this is the first place to look: the
      # cause is the toolchain rather than anything in this repository.
      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            # A tag that disagrees with the workspace version would publish
            # archives whose names promise something the binaries inside do
            # not report, which is the kind of thing nobody notices until a
            # bug report cites the wrong version.
            if [ "$tagged" != "$declared" ]; then
              echo "tag v$tagged does not match the workspace version $declared" >&2
              exit 1
            fi
            echo "version=$tagged" >> "$GITHUB_OUTPUT"
          else
            echo "version=$declared-dev" >> "$GITHUB_OUTPUT"
          fi

      # --locked, so a release is built from the dependency versions that were
      # tested rather than whatever resolved on the day.
      - name: Build
        shell: bash
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Check the Linux binaries are actually static
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          set -euo pipefail
          for bin in xpack cargo-xpack xpack-launcher xpack-updater xpack-uninstaller xpack-installer; do
            path="target/${{ matrix.target }}/release/$bin"
            file "$path"
            # A binary depends on the system's libc exactly when it names a
            # program interpreter (the dynamic loader). `ldd` is no test: its
            # wording differs between plain static and static-PIE binaries.
            if readelf --program-headers "$path" | grep -q INTERP; then
              echo "$bin is dynamically linked; it would not run on a different libc" >&2
              readelf --program-headers "$path" | grep -A1 INTERP >&2
              exit 1
            fi
          done

      # Every binary an installation needs, in one directory. That is not a
      # tidiness choice: `xpack install` and `xpack installer` find the
      # launcher, updater and uninstaller beside the `xpack` they were run
      # from, so an archive holding only the CLI would pack fine and fail to
      # install.
      - name: Stage the archive
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="xpack-$version-${{ matrix.platform }}"
          out="target/${{ matrix.target }}/release"
          suffix=""
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            suffix=".exe"
          fi

          mkdir -p "staging/$name"
          for bin in xpack cargo-xpack xpack-launcher xpack-updater xpack-uninstaller xpack-installer; do
            cp "$out/$bin$suffix" "staging/$name/"
          done
          # Only Windows distinguishes a windowed build, and only Windows
          # needs one: it is the launcher for an application with no console
          # to report to.
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            cp "$out/xpack-launcherw$suffix" "staging/$name/"
            # The installer a person double-clicks: it opens the wizard with
            # no console behind it. Scripts use the console build.
            cp "$out/xpack-installerw$suffix" "staging/$name/"
          fi
          # The update notifier ships where a dialog exists to be shown, and an
          # installation is given a copy only when its package asks to prompt.
          case "${{ matrix.platform }}" in
            windows-x64|macos-*)
              cp "$out/xpack-notify$suffix" "staging/$name/"
              ;;
          esac
          cp LICENSE "staging/$name/" 2>/dev/null || true

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          # Every target is built natively, so every one of them can be run
          # here. A release that ships a binary nobody executed is a release
          # that finds out on a user's machine.
          "staging/${{ steps.stage.outputs.name }}/xpack" --version
          "staging/${{ steps.stage.outputs.name }}/cargo-xpack" xpack --version

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.stage.outputs.name }}"
          mkdir -p dist
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../dist/$name.zip" "$name" >/dev/null
          else
            tar czf "../dist/$name.tar.gz" "$name"
          fi
          cd ..
          ls -la dist

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/*
          if-no-files-found: error

      # Every binary xPack's own package names, as built and smoke-tested
      # here, for the job that signs them. That job packs these files rather
      # than building again, so what users install is what was tested. This
      # is more than the archive holds: the package carries the windowed
      # builds on every platform.
      - name: Keep the binaries for packaging
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          suffix=""
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            suffix=".exe"
          fi
          mkdir -p prebuilt
          for bin in xpack cargo-xpack xpack-launcher xpack-launcherw xpack-updater \
                     xpack-uninstaller xpack-installer xpack-installerw xpack-notify; do
            cp "$out/$bin$suffix" prebuilt/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.platform }}
          path: prebuilt/*
          if-no-files-found: error
          retention-days: 1

  # xPack's own signed package and installer, one platform each.
  #
  # The only job that sees the signing key. It runs in the `release`
  # environment, which can be restricted to version tags, so no other branch,
  # pull request or manual run can read the key. It builds nothing: it signs
  # the binaries the build job produced.
  installers:
    name: installer / ${{ matrix.platform }}
    needs: build
    if: github.ref_type == 'tag'
    environment: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # Only for `cargo metadata`, which is how `cargo xpack` reads the
      # package; nothing is compiled.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-${{ matrix.platform }}
          path: prebuilt

      - name: Sign the package and build the installer
        shell: bash
        env:
          XPACK_SIGNING_KEY: ${{ secrets.XPACK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XPACK_SIGNING_KEY:-}" ]; then
            echo "::notice::No XPACK_SIGNING_KEY in the release environment, so this release ships without xPack's own installer and update."
            exit 0
          fi
          # Checked before anything is signed: a key that does not match the
          # published one would produce packages no installation accepts.
          public="keys/xpack-release.pub.json"
          if [ ! -f "$public" ]; then
            echo "::error::$public is missing; commit the public half of the signing key"
            exit 1
          fi

          suffix=""
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            suffix=".exe"
          fi
          # Artifacts do not keep the executable bit.
          chmod +x prebuilt/*
          # Where Cargo would have built them, which is where `--no-build`
          # looks.
          release="target/${{ matrix.target }}/release"
          mkdir -p "$release"
          cp prebuilt/* "$release/"

          key="$RUNNER_TEMP/xpack-signing.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$XPACK_SIGNING_KEY" > "$key")

          report=$("prebuilt/cargo-xpack$suffix" xpack installer -p xpack-cli \
            --target "${{ matrix.target }}" --no-build \
            --key "$key" --xpack "prebuilt/xpack$suffix" --out-dir signed)
          package=$(printf '%s\n' "$report" | sed -n 1p)
          installer=$(printf '%s\n' "$report" | sed -n 2p)

          "prebuilt/xpack$suffix" verify "$package" --key "$public"

          mkdir -p dist
          cp "$package" dist/
          # GitHub turns spaces in asset names into dots.
          name=$(basename "$installer" | tr ' ' '-')
          if [ -d "$installer" ]; then
            # A macOS bundle is a directory; ditto keeps what a zip of it
            # needs to open again as an application.
            ditto -c -k --keepParent "$installer" "dist/${name%.app}-${GITHUB_REF_NAME#v}-${{ matrix.platform }}.zip"
          else
            cp "$installer" "dist/$name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: ignore

  publish:
    name: publish the release
    needs: [build, installers]
    runs-on: ubuntu-latest
    # A dry run stops here. Everything above it has already proved the
    # archives can be built, which is the part that breaks.
    if: github.ref_type == 'tag'
    outputs:
      updates: ${{ steps.index.outputs.updates }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect the archives and their checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -path 'incoming/prebuilt-*' -prune -o -type f -name '*.tar.gz' -exec mv {} dist/ \;
          find incoming -path 'incoming/prebuilt-*' -prune -o -type f -name '*.zip' -exec mv {} dist/ \;
          # One SHA256SUMS beside the archives, in the format `sha256sum -c`
          # reads, so verifying a download needs no tooling beyond coreutils.
          find incoming -type f -name '*.sha256' -exec cat {} + > sums
          # xPack's own packages and installers, when the release was signed.
          # The zipped macOS installer was already moved with the archives.
          if compgen -G 'incoming/signed-*/*' > /dev/null; then
            for f in incoming/signed-*/*; do
              mv "$f" dist/
            done
          fi
          (cd dist && for f in *.xpkg Install-*; do
            [ -f "$f" ] && sha256sum "$f"
          done) >> sums || true
          sort -k2 -u sums > dist/SHA256SUMS
          # The Linux binaries, to write the update index with.
          mkdir -p tools
          cp incoming/prebuilt-linux-x64/xpack tools/
          chmod +x tools/xpack
          rm -rf incoming sums
          echo "publishing:"
          ls -la dist
          cat dist/SHA256SUMS

      # The GitHub CLI is preinstalled on the runner. Using it rather than a
      # third-party action keeps the release step free of code this project
      # has not read, which matters more than usual for a tool whose whole job
      # is deciding what a user's machine is allowed to run.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes=$(cat <<EOF
          ## Installing

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Or download the archive for your platform below, unpack it, and put
          the directory on your \`PATH\`. Keep the binaries together: the CLI
          finds the launcher, updater and uninstaller beside itself.

          ## Verifying a download

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          Linux binaries are statically linked against musl and run on any
          distribution, including Alpine. macOS and Windows builds are not
          code signed yet, so a browser download will be quarantined; fetching
          with \`curl\` is not.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            --title "xPack $version" \
            --notes "$notes" \
            --verify-tag \
            dist/*

      # The update index installations read, one per platform. The packages
      # stay on the release just published; the index names them by URL, so
      # the static site holds only a few small files.
      - name: Write the update index
        id: index
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'dist/*.xpkg' > /dev/null; then
            echo "::notice::No signed packages, so no update index is published."
            echo "updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p site
          tools/xpack index dist/*.xpkg \
            --out-dir site/updates \
            --key keys/xpack-release.pub.json \
            --package-url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
          find site -type f -print -exec cat {} \;
          echo "updates=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: steps.index.outputs.updates == 'true'
        with:
          path: site

  # Serves the update index. A separate job because deploying to Pages needs
  # permissions nothing else here should have.
  updates:
    name: publish the update index
    needs: publish
    if: needs.publish.outputs.updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
