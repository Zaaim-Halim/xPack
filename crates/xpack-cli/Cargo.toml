[package]
name = "xpack-cli"
description = "The xpack command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# xPack, packaged by xPack: `cargo xpack installer -p xpack-cli` builds the
# installer that puts `xpack` on a user's machine and its command on their PATH.
[package.metadata.xpack]
id = "io.xpack.xpack"
name = "xPack"
command = "xpack"
commands = ["cargo-xpack"]
launch = "xpack"
# Everything an installation of xPack needs beside `xpack`: it finds the
# launcher, updater, uninstaller and installer stubs next to itself, and ships
# `cargo xpack` so the Rust integration comes with it. The windowed builds are
# only used on Windows, and harmless elsewhere.
binaries = [
    "xpack",
    "cargo-xpack",
    "xpack-launcher",
    "xpack-launcherw",
    "xpack-updater",
    "xpack-uninstaller",
    "xpack-installer",
    "xpack-installerw",
    "xpack-notify",
]
installer-ui = "installer-ui.json"
# Each platform's own format; only the one being built is packed.
icon = { macos = "assets/xpack.icns", windows = "assets/xpack.ico", linux = "assets/xpack.png" }
# Each platform's update index, published to GitHub Pages by the release
# workflow; the packages it names are attached to the GitHub Release.
update-url = "https://zaaim-halim.github.io/xPack/updates/{platform}"

[[bin]]
name = "xpack"
path = "src/main.rs"

# `cargo xpack`: Cargo runs any `cargo-<name>` on the PATH as a subcommand,
# so shipping this beside `xpack` is the whole Rust integration.
[[bin]]
name = "cargo-xpack"
path = "src/bin/cargo-xpack.rs"

# A stand-in for "the application" in the end-to-end tests.
#
# It lives here rather than in a crate of its own because that is the only
# arrangement Cargo guarantees: `CARGO_BIN_EXE_xpack-test-payload` names the
# built path for this package's tests, whereas a sibling crate's binary is
# not built by `cargo test --all-targets` at all — checked, not assumed.
#
# The tests used to write a `#!/bin/sh` script and call it the payload, which
# Windows cannot execute: `CreateProcess` runs executables and refuses a
# script with "not a valid Win32 application".
[[bin]]
name = "xpack-test-payload"
path = "src/bin/xpack-test-payload.rs"

[dependencies]
xpack-core.workspace = true
xpack-security.workspace = true
xpack-package.workspace = true
xpack-platform.workspace = true
xpack-install.workspace = true
clap.workspace = true
editpe.workspace = true
# Branded copies are made somewhere that cleans itself up, so a failed build
# leaves no half-edited executables behind.
tempfile.workspace = true
image.workspace = true
indicatif.workspace = true
xpack-update.workspace = true
xpack-installer.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
xpack-log.workspace = true

[dev-dependencies]
# The branding test reads back what was written with the same reader that
# wrote it, rather than a shape re-declared in the test.
editpe.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# The end-to-end tests parse the index the CLI writes with the *updater's* own
# type. Asserting on a shape re-declared in the test would prove only that the
# test agrees with itself.
xpack-update.workspace = true
xpack-security.workspace = true
xpack-core.workspace = true

[lints]
workspace = true
