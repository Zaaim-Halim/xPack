[package]
name = "xpack-cli"
description = "The xpack command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "xpack"
path = "src/main.rs"

# A stand-in for "the application" in the end-to-end tests.
#
# It lives here rather than in a crate of its own because that is the only
# arrangement Cargo guarantees: `CARGO_BIN_EXE_xpack-test-payload` names the
# built path for this package's tests, whereas a sibling crate's binary is
# not built by `cargo test --all-targets` at all — checked, not assumed.
#
# The tests used to write a `#!/bin/sh` script and call it the payload, which
# Windows cannot execute: `CreateProcess` runs executables and refuses a
# script with "not a valid Win32 application".
[[bin]]
name = "xpack-test-payload"
path = "src/bin/xpack-test-payload.rs"

[dependencies]
xpack-core.workspace = true
xpack-security.workspace = true
xpack-package.workspace = true
xpack-platform.workspace = true
xpack-install.workspace = true
clap.workspace = true
editpe.workspace = true
# Branded copies are made somewhere that cleans itself up, so a failed build
# leaves no half-edited executables behind.
tempfile.workspace = true
image.workspace = true
indicatif.workspace = true
xpack-update.workspace = true
xpack-installer.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
xpack-log.workspace = true

[dev-dependencies]
# The branding test reads back what was written with the same reader that
# wrote it, rather than a shape re-declared in the test.
editpe.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# The end-to-end tests parse the index the CLI writes with the *updater's* own
# type. Asserting on a shape re-declared in the test would prove only that the
# test agrees with itself.
xpack-update.workspace = true
xpack-security.workspace = true
xpack-core.workspace = true

[lints]
workspace = true
