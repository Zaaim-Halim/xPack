[package]
name = "xpack-platform"
description = "Cross-process locking, process launching and OS integration for xPack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reflink-copy.workspace = true
xpack-core.workspace = true
tracing.workspace = true

# Free disk space, through a safe interface. Already in the dependency tree.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

# Two Win32 calls: telling running programs that the user's environment
# changed (see `environment.rs`), and asking a volume how much room it has
# (see `space.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: one Windows call needs it, and is allowed where it is made, with
# its justification. Denied, every other use still fails the build.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
