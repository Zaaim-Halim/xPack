[package]
name = "xpack-launcher"
description = "The small native binary that starts an installed application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "xpack-launcher"
path = "src/main.rs"

# The same program linked for the Windows subsystem, so a desktop shortcut can
# open an application without a console window appearing behind it. Built on
# every platform to keep one build graph; installed only on Windows, where the
# subsystem attribute means anything.
[[bin]]
name = "xpack-launcherw"
path = "src/bin/launcherw.rs"

[dependencies]
xpack-core.workspace = true
xpack-install.workspace = true
xpack-platform.workspace = true
tracing.workspace = true
xpack-log.workspace = true

[dev-dependencies]
tempfile.workspace = true
xpack-security.workspace = true
xpack-package.workspace = true

[lints]
workspace = true
